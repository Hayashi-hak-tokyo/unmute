<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unmute (アンミュート) アプリプロトタイプ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (ブラウザ内でJSXをコンパイル) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- アイコンコンポーネント (LucideアイコンのSVGをReactコンポーネント化) ---
    const Bell = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>;
    const MessageSquare = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const User = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const Send = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
    const ArrowLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
    const Home = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const BookOpen = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
    const Plus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    const Calendar = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const Star = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
    const Video = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>;

    // --- カスタムレーダーチャートコンポーネント ---
    const RadarChart = ({ data }) => {
      const size = 260;
      const center = size / 2;
      const radius = 100;
      const numAxes = data.length;

      const getPoint = (value, index, max = 100) => {
        const angle = (Math.PI * 2 * index) / numAxes - Math.PI / 2;
        const r = (value / max) * radius;
        return {
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle),
        };
      };

      const bgLevels = [20, 40, 60, 80, 100];

      return (
        <div className="relative flex justify-center items-center my-6">
          <svg width={size} height={size} className="overflow-visible">
            {bgLevels.reverse().map((level, i) => {
              const points = data.map((_, index) => {
                const p = getPoint(level, index);
                return `${p.x},${p.y}`;
              }).join(' ');
              return (
                <polygon
                  key={level}
                  points={points}
                  fill={i % 2 === 0 ? '#FEF3C7' : '#FDE68A'}
                  stroke="#FCD34D"
                  strokeWidth="0.5"
                />
              );
            })}

            {data.map((_, index) => {
              const p = getPoint(100, index);
              return (
                <line
                  key={`axis-${index}`}
                  x1={center}
                  y1={center}
                  x2={p.x}
                  y2={p.y}
                  stroke="#FFFFFF"
                  strokeWidth="2"
                />
              );
            })}

            <polygon
              points={data.map((d, index) => {
                const p = getPoint(d.score, index);
                return `${p.x},${p.y}`;
              }).join(' ')}
              fill="rgba(249, 115, 22, 0.6)"
              stroke="#EA580C"
              strokeWidth="2"
            />

            {data.map((d, index) => {
              const p = getPoint(d.score, index);
              const labelP = getPoint(125, index);
              
              return (
                <g key={`point-${index}`}>
                  <circle cx={p.x} cy={p.y} r="4" fill="#EA580C" />
                  <text
                    x={labelP.x}
                    y={labelP.y}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    className="text-[10px] font-bold fill-gray-800"
                  >
                    <tspan x={labelP.x} dy="-0.6em">{d.score}</tspan>
                    <tspan x={labelP.x} dy="1.2em" className="text-[8px] font-normal">{d.label}</tspan>
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    // --- ホーム画面コンポーネント ---
    const HomeScreen = ({ navigateTo }) => {
      const chartData = [
        { label: 'Deep\nListening', score: 45 },
        { label: 'Pattern\nReading', score: 80 },
        { label: 'Tactical\nLabeling', score: 26 },
        { label: 'Boundary\nSetting', score: 48 },
        { label: 'Context\nFraming', score: 79 },
        { label: 'Internal\nReset', score: 23 },
      ];

      return (
        <div className="flex-1 overflow-y-auto pb-24 bg-gray-50 hide-scrollbar">
          <div className="flex justify-between items-center px-6 pt-16 pb-4 bg-white sticky top-0 z-10">
            <h1 className="text-xl font-bold text-gray-900">ソーシャルスキルグラフ</h1>
            <Bell className="w-6 h-6 text-gray-500" />
          </div>

          <div className="px-6 py-4">
            <div className="bg-white rounded-xl p-4 mb-6 shadow-sm flex justify-between items-center border border-gray-100">
              <div className="flex items-center space-x-3 text-sm text-gray-700">
                <span className="bg-gray-100 p-2 rounded-lg">📅</span>
                <p>次回のアドバイザーとの面談が<strong>2月16日</strong>にあります。</p>
              </div>
              <button className="bg-black text-white text-xs px-3 py-1.5 rounded-full font-medium">変更</button>
            </div>

            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 mb-6 flex flex-col items-center">
              <RadarChart data={chartData} />
              
              <div className="w-full mt-6 bg-gray-50 rounded-2xl p-6 text-center">
                <div className="flex items-center justify-center space-x-2 mb-2">
                  <span className="text-sm text-gray-500 font-medium">現在</span>
                  <span className="text-4xl font-bold text-gray-900">45</span>
                  <span className="text-xl text-green-500">↗</span>
                </div>
                <h2 className="text-lg font-bold text-gray-900 mb-2">温度を感じる、深い傾聴</h2>
                <p className="text-sm text-gray-600 leading-relaxed">
                  何気ない言葉の裏に潜む「本当の願い」と感情の温度を感じ取り、二人の理解を深めることができるようになります。
                </p>
                <div className="flex justify-center space-x-1 mt-4">
                  <div className="w-2 h-2 rounded-full bg-black"></div>
                  <div className="w-2 h-2 rounded-full bg-gray-300"></div>
                  <div className="w-2 h-2 rounded-full bg-gray-300"></div>
                  <div className="w-2 h-2 rounded-full bg-gray-300"></div>
                  <div className="w-2 h-2 rounded-full bg-gray-300"></div>
                </div>
              </div>
            </div>

            <div className="space-y-3">
              <button 
                onClick={() => navigateTo('chat')}
                className="w-full bg-black text-white py-4 rounded-full font-bold flex items-center justify-center space-x-2 hover:bg-gray-800 transition"
              >
                <MessageSquare className="w-5 h-5" />
                <span>AIで練習</span>
              </button>
              <button className="w-full bg-white text-black border border-black py-4 rounded-full font-bold flex items-center justify-center space-x-2 hover:bg-gray-50 transition">
                <User className="w-5 h-5" />
                <span>人と実際に練習</span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- AIトレーニング画面（チャット）コンポーネント ---
    const ChatScreen = ({ navigateTo }) => {
      const [messages, setMessages] = useState([
        { id: 1, sender: 'ai', text: 'こんにちは。今日のAIロールプレイは「パートナーに自分の不満を感情的にならずに伝える」練習です。準備はいいですか？' }
      ]);
      const [inputText, setInputText] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const handleSend = () => {
        if (!inputText.trim()) return;

        const newUserMsg = { id: Date.now(), sender: 'user', text: inputText };
        setMessages(prev => [...prev, newUserMsg]);
        setInputText('');
        setIsTyping(true);

        setTimeout(() => {
          setIsTyping(false);
          let aiResponse = "";
          
          if (newUserMsg.text.includes("嫌だ") || newUserMsg.text.includes("不満")) {
            aiResponse = "素直な気持ち（Unmute）が出せましたね。ただ、少し相手を責めるニュアンスが含まれているかもしれません。「私は〇〇と感じている」という『アイ・メッセージ』に言い換えてみましょう。";
          } else {
            aiResponse = "なるほど、その伝え方はとても柔らかくて良いですね！相手も防衛的にならずに話を聞いてくれそうです。もう一歩踏み込んで、あなたが『本当はどうしてほしかったのか』を付け加えてみませんか？";
          }

          setMessages(prev => [...prev, { id: Date.now() + 1, sender: 'ai', text: aiResponse }]);
        }, 1500);
      };

      return (
        <div className="flex-1 flex flex-col bg-gray-50 h-full">
          <div className="flex items-center px-4 pt-16 pb-4 bg-white border-b border-gray-100 z-10 sticky top-0">
            <button onClick={() => navigateTo('home')} className="p-2 -ml-2 text-gray-600">
              <ArrowLeft className="w-6 h-6" />
            </button>
            <div className="ml-2">
              <h1 className="text-base font-bold text-gray-900">AIロールプレイ</h1>
              <p className="text-xs text-gray-500">テーマ：本音を伝える</p>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-6 hide-scrollbar">
            <div className="text-center text-xs text-gray-400 my-4">今日 14:00</div>
            
            {messages.map((msg) => (
              <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                {msg.sender === 'ai' && (
                  <div className="w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center text-white font-bold text-xs mr-2 shrink-0">
                    AI
                  </div>
                )}
                <div 
                  className={`max-w-[75%] rounded-2xl px-4 py-3 text-sm shadow-sm ${
                    msg.sender === 'user' 
                      ? 'bg-black text-white rounded-tr-sm' 
                      : 'bg-white text-gray-800 rounded-tl-sm border border-gray-100'
                  }`}
                >
                  {msg.text}
                </div>
              </div>
            ))}
            
            {isTyping && (
              <div className="flex justify-start items-center">
                 <div className="w-8 h-8 rounded-full bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center text-white font-bold text-xs mr-2 shrink-0">
                    AI
                  </div>
                <div className="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-4 shadow-sm flex space-x-1">
                  <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
                  <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                  <div className="w-2 h-2 bg-gray-300 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          <div className="bg-white border-t border-gray-100 p-4 pb-10">
            {inputText.length > 0 && (
              <div className="mb-2 px-3 py-2 bg-orange-50 text-orange-800 text-xs rounded-lg flex items-center">
                💡 感情的にならず、「私」を主語にして伝えてみましょう
              </div>
            )}
            <div className="flex items-center bg-gray-100 rounded-full px-4 py-2">
              <input
                type="text"
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                placeholder="メッセージを入力..."
                className="flex-1 bg-transparent border-none focus:outline-none text-sm text-gray-800 py-2"
              />
              <button 
                onClick={handleSend}
                disabled={!inputText.trim()}
                className={`p-2 rounded-full transition ${inputText.trim() ? 'bg-black text-white' : 'bg-gray-200 text-gray-400'}`}
              >
                <Send className="w-4 h-4" />
              </button>
            </div>
          </div>
        </div>
      );
    };

    // --- 記録（言語化ノート）画面コンポーネント ---
    const LogScreen = () => {
      const logs = [
        { id: 1, date: '2月12日 (月)', title: '上司からの急な依頼にモヤモヤした', tag: 'Boundary Setting', ai: '「断れない」という思い込みに気づけましたね。次は条件を提示してみましょう。' },
        { id: 2, date: '2月10日 (土)', title: 'パートナーとの口論後の仲直り', tag: 'Tactical Labeling', ai: '相手の「悲しい」という感情にラベル付けできたことで、冷静な対話ができました。' },
        { id: 3, date: '2月8日 (木)', title: '初対面の人とのランチ', tag: 'Deep Listening', ai: '質問の意図を汲み取ろうとする姿勢が素晴らしいです。次は相槌のバリエーションを。' },
      ];

      return (
        <div className="flex-1 overflow-y-auto pb-24 bg-gray-50 hide-scrollbar">
          <div className="flex justify-between items-center px-6 pt-16 pb-4 bg-white sticky top-0 z-10 border-b border-gray-100">
            <h1 className="text-xl font-bold text-gray-900">言語化ノート</h1>
          </div>

          <div className="p-6">
            <button className="w-full bg-black text-white py-4 rounded-xl font-bold flex items-center justify-center space-x-2 shadow-sm mb-8 hover:bg-gray-800 transition">
              <Plus className="w-5 h-5" />
              <span>今日の感情を記録する</span>
            </button>

            <h2 className="text-sm font-bold text-gray-500 mb-4 px-1">過去の記録</h2>
            <div className="space-y-4">
              {logs.map(log => (
                <div key={log.id} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                  <div className="flex justify-between items-start mb-2">
                    <span className="text-xs font-medium text-gray-400">{log.date}</span>
                    <span className="text-[10px] bg-orange-100 text-orange-700 px-2 py-1 rounded-full font-bold">{log.tag}</span>
                  </div>
                  <h3 className="text-base font-bold text-gray-900 mb-3 leading-tight">{log.title}</h3>
                  <div className="bg-gray-50 rounded-xl p-3 flex space-x-3 items-start">
                    <div className="w-6 h-6 rounded-full bg-gradient-to-br from-orange-400 to-amber-500 flex items-center justify-center text-white font-bold text-[10px] shrink-0 mt-0.5">AI</div>
                    <p className="text-xs text-gray-600 leading-relaxed">{log.ai}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- 専門家（アドバイザー相談）画面コンポーネント ---
    const ExpertScreen = () => {
      const experts = [
        { id: 1, name: '佐藤 結衣', role: '臨床心理士 / 夫婦カウンセラー', rating: '4.9', sessions: '1,200+', img: '👩‍⚕️' },
        { id: 2, name: '鈴木 健太', role: 'キャリアコンサルタント', rating: '4.8', sessions: '850+', img: '👨‍💼' },
      ];

      return (
        <div className="flex-1 overflow-y-auto pb-24 bg-gray-50 hide-scrollbar">
          <div className="flex justify-between items-center px-6 pt-16 pb-4 bg-white sticky top-0 z-10 border-b border-gray-100">
            <h1 className="text-xl font-bold text-gray-900">アドバイザー相談</h1>
          </div>

          <div className="p-6">
            <h2 className="text-sm font-bold text-gray-500 mb-3 px-1">次回の予定</h2>
            <div className="bg-black text-white p-5 rounded-2xl shadow-md mb-8">
              <div className="flex justify-between items-start mb-4">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-xl">👩‍🏫</div>
                  <div>
                    <h3 className="font-bold text-sm">田中 美咲 先生</h3>
                    <p className="text-xs text-gray-400">行動科学メンター</p>
                  </div>
                </div>
                <div className="bg-white/20 p-2 rounded-lg"><Video className="w-4 h-4 text-white" /></div>
              </div>
              <div className="bg-white/10 rounded-xl p-3 flex items-center space-x-3 text-sm">
                <Calendar className="w-4 h-4 text-orange-400" />
                <span>2月16日 (金) 20:00 - 20:45</span>
              </div>
            </div>

            <div className="flex justify-between items-end mb-4 px-1">
              <h2 className="text-sm font-bold text-gray-500">おすすめの専門家</h2>
              <button className="text-xs font-bold text-orange-500">すべて見る</button>
            </div>
            
            <div className="space-y-4">
              {experts.map(expert => (
                <div key={expert.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4">
                  <div className="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center text-3xl shrink-0">
                    {expert.img}
                  </div>
                  <div className="flex-1">
                    <h3 className="font-bold text-gray-900 text-sm">{expert.name}</h3>
                    <p className="text-xs text-gray-500 mb-1">{expert.role}</p>
                    <div className="flex items-center space-x-3 text-[10px] font-medium text-gray-600">
                      <span className="flex items-center"><Star className="w-3 h-3 text-yellow-400 mr-0.5" /> {expert.rating}</span>
                      <span>相談件数 {expert.sessions}</span>
                    </div>
                  </div>
                  <button className="bg-gray-100 text-gray-900 px-3 py-1.5 rounded-full text-xs font-bold hover:bg-gray-200 transition">
                    詳細
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- メインアプリケーション ---
    function App() {
      const [activeTab, setActiveTab] = useState('home');

      const renderScreen = () => {
        switch (activeTab) {
          case 'home':
            return <HomeScreen navigateTo={setActiveTab} />;
          case 'chat':
            return <ChatScreen navigateTo={setActiveTab} />;
          case 'log':
            return <LogScreen />;
          case 'expert':
            return <ExpertScreen />;
          default:
            return (
              <div className="flex-1 flex items-center justify-center bg-gray-50">
                <p className="text-gray-500">Coming Soon...</p>
              </div>
            );
        }
      };

      return (
        <div className="min-h-screen bg-gray-200 flex justify-center items-center p-4">
          <div className="w-full max-w-[393px] h-[852px] bg-white rounded-[55px] shadow-2xl relative overflow-hidden flex flex-col border-[14px] border-black ring-1 ring-gray-200">
            
            {/* ステータスバーとDynamic Island */}
            <div className="absolute top-0 inset-x-0 h-14 flex justify-between items-center px-7 z-50 pointer-events-none">
              <span className="text-[15px] font-semibold text-black tracking-tight mt-1">4:19</span>
              
              <div className="absolute left-1/2 -translate-x-1/2 top-3 w-[120px] h-[32px] bg-black rounded-full"></div>
              
              <div className="flex items-center space-x-1.5 mt-1 text-black">
                <svg width="17" height="12" viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect y="8" width="3" height="4" rx="1" fill="currentColor"/>
                  <rect x="4.5" y="5" width="3" height="7" rx="1" fill="currentColor"/>
                  <rect x="9" y="2" width="3" height="10" rx="1" fill="currentColor"/>
                  <rect x="13.5" width="3" height="12" rx="1" fill="currentColor"/>
                </svg>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8 12L0 3.5C2.5 1 5 0 8 0C11 0 13.5 1 16 3.5L8 12Z" fill="currentColor"/>
                </svg>
                <svg width="25" height="12" viewBox="0 0 25 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor"/>
                  <rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/>
                  <path d="M23 4V8C23.5523 8 24 7.5523 24 7V5C24 4.4477 23.5523 4 23 4Z" fill="currentColor"/>
                </svg>
              </div>
            </div>

            {/* 画面コンテンツ */}
            {renderScreen()}

            {/* ボトムナビゲーション */}
            {activeTab !== 'chat' && (
              <div className="absolute bottom-0 inset-x-0 bg-white border-t border-gray-100 pb-8 pt-3 px-6 flex justify-between items-center z-20">
                <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center space-y-1 ${activeTab === 'home' ? 'text-black' : 'text-gray-400'}`}>
                  <Home className="w-6 h-6" />
                  <span className="text-[10px] font-medium">ホーム</span>
                </button>
                <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center space-y-1 ${activeTab === 'chat' ? 'text-black' : 'text-gray-400'}`}>
                  <MessageSquare className="w-6 h-6" />
                  <span className="text-[10px] font-medium">AI練習</span>
                </button>
                <button onClick={() => setActiveTab('log')} className={`flex flex-col items-center space-y-1 ${activeTab === 'log' ? 'text-black' : 'text-gray-400'}`}>
                  <BookOpen className="w-6 h-6" />
                  <span className="text-[10px] font-medium">記録</span>
                </button>
                <button onClick={() => setActiveTab('expert')} className={`flex flex-col items-center space-y-1 ${activeTab === 'expert' ? 'text-black' : 'text-gray-400'}`}>
                  <User className="w-6 h-6" />
                  <span className="text-[10px] font-medium">専門家</span>
                </button>
              </div>
            )}

            {/* ホームインジケーター */}
            <div className="absolute bottom-2 inset-x-0 h-4 flex justify-center items-center z-50 pointer-events-none">
              <div className="w-[134px] h-[5px] bg-black rounded-full"></div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
